<div class="px-20 mt-10">
    <app-carousel-slider></app-carousel-slider>
    
    <div class="mt-8">
        <h4 class="text-3xl font-bold">Featured Products</h4>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mt-6">
            @for (product of featuredProducts(); track product._id || $index){
                <app-product-card [product]="product"></app-product-card>
            }
        </div>
    </div>

    <hr class="mt-12">

    <div class="mt-8">
        <h4 class="text-4xl font-bold">New Products</h4>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mt-6">
            @for (product of newProducts(); track product._id || $index){
                <app-product-card [product]="product"></app-product-card>
            }
        </div>
    </div>
</div>
