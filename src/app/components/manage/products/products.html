<div class=" px-40 mt-10">
    <div class="flex justify-between">
        <h1 class="text-3xl font-bold">Manage Products</h1>
        <button class="cursor-pointer text-white bg-blue-500 hover:bg-blue-600" mat-raised-button color="primary" routerLink="/admin/products/add">Add New Product</button>
    </div>
    <div class="shadow mt-4">
        <mat-form-field class="w-full">
        <mat-label>Filter</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Search" #input>
        </mat-form-field>
        <table mat-table [dataSource]="dataSource" matSort>

            <!-- ID Column -->
            <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
            <td mat-cell *matCellDef="let row"> {{row._id}} </td>
            </ng-container>
            <!-- Name Column -->
            <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
            <td mat-cell *matCellDef="let row"> {{row.name || "N/A"}} </td>
            </ng-container>

            <!-- shotDescription -->
            <ng-container matColumnDef="shotDescription">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Short Description </th>
            <td mat-cell *matCellDef="let row"> {{row.shotDescription || "N/A"}} </td>
            </ng-container>

            <!-- price -->
            <ng-container matColumnDef="price">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Price </th>
            <td mat-cell *matCellDef="let row"> {{row.price || "N/A"}} </td>
            </ng-container>

            <!-- discount -->
            <ng-container matColumnDef="discount">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Discount </th>
            <td mat-cell *matCellDef="let row"> {{row.discount || "N/A"}} </td>
            </ng-container>

            <ng-container matColumnDef="categoryId">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Category </th>
            <td mat-cell *matCellDef="let row"> {{row.categoryId || "N/A"}} </td>
            </ng-container>

            <!-- Fruit Column -->
            <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef> Action </th>
            <td mat-cell *matCellDef="let row">
                <button mat-icon-button class="mr-4"  [routerLink]="'/admin/products/'+row._id">
                    <mat-icon class="text-blue-500 hover:text-blue-800" >edit</mat-icon>
                </button>
                <button mat-icon-button   (click)="deleteProduct(row._id)">
                    <mat-icon class="text-red-500 hover:text-red-800" >delete</mat-icon>
                </button>
            </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <!-- Row shown when there is no matching data. -->
            <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="2">No data matching the filter "{{input.value}}"</td>
            </tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select"></mat-paginator>
    </div>
</div>
