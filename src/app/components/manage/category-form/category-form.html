<div class="flex flex-col items-center px-40 mt-10">
    @if(isEdit){
        <h1 class="text-3xl font-bold mb-10">Update Category</h1>

    }@else{
        <h1 class="text-3xl font-bold mb-10">Add New Category</h1>
    }
    <form class="shadow-sm w-96 p-10">
        <div class="flex flex-wrap">
            <div class="w-full gap-4">

                
                <mat-form-field class="w-full">
                    <mat-label>Name</mat-label>
                    <input matInput type="text" [(ngModel)]="name" name="name" required>
                </mat-form-field>
            </div>
            <div class="w-full flex justify-center items-center mt-4">

                 @if(isEdit){
                        <button mat-raised-button color="primary" [disabled]="!name" (click)="update()">Update Category</button>

                    }@else{
                        <button mat-raised-button color="primary" [disabled]="!name" (click)="add()">Add Category</button>
                    }
                
            </div>
        </div>
    </form>
</div>
